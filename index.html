<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090B11" />

    <title>Bruno Sosa Villamón — Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-Stack Developer y Co-Founder de Stratus Industries. Construyo software que sostiene negocios reales: de la primera línea de código al servidor en producción."
    />

    <!-- Tarjeta de vista previa al compartir el link (LinkedIn, WhatsApp,
         Slack, X). IMPORTANTE: og:image y og:url tienen que ser URLs
         ABSOLUTAS — los scrapers no resuelven rutas relativas. Al
         desplegar, reemplazá TU-DOMINIO por el dominio real y volvé a
         pasar el link por el Post Inspector de LinkedIn para que refresque
         su caché (guarda la versión vieja hasta 7 días). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bruno Sosa Villamón" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://TU-DOMINIO.vercel.app/" />
    <meta property="og:title" content="Bruno Sosa Villamón — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Construyo software que sostiene negocios reales: de la primera línea de código al servidor en producción."
    />
    <meta property="og:image" content="https://TU-DOMINIO.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bruno Sosa Villamón, Full-Stack Developer y Co-Founder de Stratus Industries."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bruno Sosa Villamón — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Construyo software que sostiene negocios reales: de la primera línea de código al servidor en producción."
    />
    <meta name="twitter:image" content="https://TU-DOMINIO.vercel.app/og.jpg" />

    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=switzer@300,400,500,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090B11'/%3E%3Cpath d='M9 23V9h7.2c2.6 0 4.2 1.3 4.2 3.4 0 1.6-.9 2.7-2.4 3.1 1.9.3 3 1.6 3 3.5 0 2.4-1.8 4-4.7 4H9Zm3.1-8.4h3.4c1.2 0 1.9-.6 1.9-1.6s-.7-1.6-1.9-1.6h-3.4v3.2Zm0 6h3.7c1.3 0 2.1-.7 2.1-1.8s-.8-1.8-2.1-1.8h-3.7v3.6Z' fill='%23FFFFFF'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Fija tema e idioma antes del primer pintado. Si esto corriera
         dentro de React, la página parpadearía en oscuro antes de pasar
         a claro, y en español antes de pasar a inglés, en cada carga. -->
    <script>
      ;(function () {
        var root = document.documentElement

        try {
          var savedTheme = localStorage.getItem('bsv-theme')
          var prefersLight =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          root.dataset.theme =
            savedTheme || (prefersLight ? 'light' : 'dark')
        } catch (e) {
          root.dataset.theme = 'dark'
        }

        try {
          var savedLang = localStorage.getItem('bsv-lang')
          if (savedLang !== 'es' && savedLang !== 'en') {
            // Sin elección previa seguimos al navegador: cualquier cosa
            // que no sea español arranca en inglés, que es el caso de un
            // reclutador de afuera abriendo el link.
            var nav = (navigator.language || 'es').toLowerCase()
            savedLang = nav.indexOf('es') === 0 ? 'es' : 'en'
          }
          root.lang = savedLang
        } catch (e) {
          root.lang = 'es'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
